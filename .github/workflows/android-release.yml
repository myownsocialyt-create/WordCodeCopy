name: Android CI - Build Signed APK & AAB

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, Test & Sign Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD != '' && secrets.KEYSTORE_PASSWORD || 'password' }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS != '' && secrets.KEY_ALIAS || 'upload' }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD != '' && secrets.KEY_PASSWORD || 'password' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build signed release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Build signed release AAB (Play Store bundle)
        run: ./gradlew bundleRelease --stacktrace

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Report obfuscation stats (R8 mapping)
        run: |
          MAPPING=app/build/outputs/mapping/release/mapping.txt
          if [ -f "$MAPPING" ]; then
            TOTAL=$(grep -c ' -> ' "$MAPPING" || true)
            CLASSES=$(grep -cE '^[^ ].* -> .*:$' "$MAPPING" || true)
            echo "Obfuscated mapping entries: $TOTAL (classes: $CLASSES)"
            echo "Sample renamed classes:"
            grep -E '^com\.' "$MAPPING" | head -n 10 || true
          else
            echo "::error::mapping.txt not found - R8 obfuscation did not run!"
            exit 1
          fi

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordSearch-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload signed AAB artifact (for Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: WordSearch-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload R8 mapping file (for Play Console de-obfuscation)
        uses: actions/upload-artifact@v4
        with:
          name: WordSearch-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Upload unit test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  smoke-test:
    name: Emulator smoke test (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 30, 34]

    steps:
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: WordSearch-release-apk
          path: apk

      - name: Write smoke test script
        run: |
          cat > smoke.sh <<'SMOKE'
          #!/usr/bin/env bash
          set +e
          emit_error() {
            # Emit a (possibly multiline) message as a GitHub error annotation.
            local msg="$1"
            msg="${msg//'%'/%25}"; msg="${msg//$'\n'/%0A}"; msg="${msg//$'\r'/%0D}"
            echo "::error::${msg}"
          }
          echo "== Installing APK =="
          INSTALL_OUT=$(adb install -r apk/app-release.apk 2>&1); INSTALL_RC=$?
          echo "$INSTALL_OUT"
          if [ $INSTALL_RC -ne 0 ]; then emit_error "adb install FAILED: $INSTALL_OUT"; exit 1; fi
          adb logcat -c
          echo "== Launching app =="
          LAUNCH_OUT=$(adb shell monkey -p com.wordsearch.ds -c android.intent.category.LAUNCHER 1 2>&1)
          echo "$LAUNCH_OUT"
          sleep 40
          adb logcat -d > logcat.txt 2>/dev/null
          adb logcat -d -b crash > logcat-crash.txt 2>/dev/null
          echo "== Logcat captured: $(wc -l < logcat.txt) lines =="
          if grep -q "FATAL EXCEPTION" logcat.txt logcat-crash.txt 2>/dev/null; then
            TRACE=$(grep -h -A 80 "FATAL EXCEPTION" logcat.txt logcat-crash.txt 2>/dev/null | head -100)
            echo "$TRACE"
            emit_error "APP CRASHED. Stack trace (part 1): $(echo "$TRACE" | head -35)"
            emit_error "Stack trace (part 2): $(echo "$TRACE" | sed -n '36,70p')"
            emit_error "Stack trace (part 3): $(echo "$TRACE" | sed -n '71,100p')"
            exit 1
          fi
          PID=$(adb shell pidof com.wordsearch.ds | tr -d '[:space:]')
          if [ -z "$PID" ]; then
            INFO=$(grep -E "wordsearch|AndroidRuntime|ActivityManager|am_proc_died|am_crash" logcat.txt | tail -50)
            emit_error "App process not running 40s after launch (no FATAL EXCEPTION found). Recent logs: $INFO"
            exit 1
          fi
          echo "::notice::SMOKE TEST PASSED - app alive (pid=$PID) 40s after launch, no fatal exceptions."
          SMOKE
          chmod +x smoke.sh

      - name: Boot emulator, install & launch app, detect crashes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash ./smoke.sh

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logcat
          path: |
            logcat.txt
            logcat-crash.txt
          if-no-files-found: ignore
